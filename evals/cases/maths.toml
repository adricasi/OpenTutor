# Evaluation cases for the Maths tutor (REQ-014, T-023). Each case is a typed exercise.
# expected_answer is matched after normalisation (lower case, no spaces/asterisks/$);
# answer_forms lists other spellings of the same answer. acs = criteria the case proves.

[[cases]]
