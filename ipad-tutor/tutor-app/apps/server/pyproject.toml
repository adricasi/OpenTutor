[project]
name = "inktutor-server"
version = "0.1.0"
description = "Ink Tutor server: ink store, recognition, checkers, tutor, agent, runtime, store"
requires-python = ">=3.12,<3.13"
dependencies = [
  "inktutor-protocol",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "numpy>=1.26",
  "pillow>=10.4",
  "sympy>=1.13",
  "antlr4-python3-runtime==4.11.*", # sympy's LaTeX parser
  "httpx>=0.27",
  "segno>=1.6",
  "anthropic>=0.70", # tier-2 cloud toggle (Claude)
  "openai>=1.100", # tier-2 cloud toggle (OpenAI Responses API)
  "zeroconf>=0.140",  # Bonjour: advertise "Ink Tutor" while make pair runs
]

[project.optional-dependencies]
mlx = ["mlx-vlm==0.7.10"]  # tier 1 in-process + the tier-2 model server (Apple Silicon)
math = ["mathnote-ocr==0.2.1"]  # stroke-based math OCR (experimental; see docs/OBSERVATIONS.md)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inktutor_server"]
