# Pinned model inventory. `make models` downloads what is referenced by .env (LOCAL_MODEL) plus all tier1/voice entries.
# `repo` = exact Hugging Face repo id, `revision` = commit sha (verified 2026-10-24 against the Hugging Face API).
# `memory_gb` = resident estimate in GB (weights + typical KV cache); `disk_gb` = download size.
# `offload` = expert-offload store (mlx_vlm.moe_offload repack, `uv run models/fetch.py --offload KEY`) under
# models/weights/; the runtime uses it when the full model doesn't fit in free memory (experts paged from SSD).
# `offload_resident_gb` = what stays resident in that mode besides the expert cache.

[tier2.qwen36-35b-a3b]
name = "Qwen3.6-35B-A3B (vision, MoE, 3B active)"
repo = "mlx-community/Qwen3.6-35B-A3B-4bit"   # 4-bit affine, router/shared-expert gates kept at 8-bit; vision tower included
revision = "38740b847e4cb78f352aba30aa41c76e08e6eb46"
quant = "mlx-4bit (8-bit gates)"
disk_gb = 20.4
memory_gb = 21
offload = "offload/qwen36-35b-a3b"
offload_resident_gb = 3.0

[tier2.gemma4-26b-a4b]
name = "Gemma 4 26B-A4B (vision, MoE, ~3.8B active)"
repo = "mlx-community/gemma-4-26B-A4B-it-qat-4bit"   # QAT build: Google's quantization-aware weights, better 4-bit quality than post-hoc 4-bit
revision = "0e3cbab38ce568cf6e23543010d08d03b731910c"
quant = "mlx-4bit (QAT)"
disk_gb = 15.6
memory_gb = 16
default = true   # decision 2026-10-24: fits fully resident on the reference Mac (M3 Pro, 36 GB) (DECISIONS #25)
license_note = "Gemma Terms of Use"
offload = "offload/gemma4-26b-a4b"
offload_resident_gb = 2.5

[tier2.qwen38-27b]
name = "Qwen3.8-27B (vision, dense; stronger, ~3x slower decode)"
repo = "mlx-community/Qwen3.8-27B-4bit"
revision = "10c35caafbb80f7dc6a7a432cdd11af10a6d4818"
quant = "mlx-4bit"
disk_gb = 16.1
memory_gb = 17

