[project]
name = "inktutor-protocol"
version = "0.1.0"
description = "Ink Tutor wire contract: pydantic models, JSON schema, generated TS types"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inktutor_protocol"]
