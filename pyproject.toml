[project]
name = "opentutor"
version = "0.1.0"
description = "Offline AI homework tutor hub: one laptop running Gemma 4 serves a classroom of phones over local Wi-Fi, zero data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "ollama>=0.6.3",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "segno>=1.6.6",
    "sympy>=1.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "httpx>=0.28.1",
]

[project.scripts]
opentutor = "opentutor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opentutor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["ipad-tutor", "prototype"]  # own toolchains (ipad-tutor/README.md, prototype/README.md)

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: tests that need external services"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true  # sympy ships no type information
